name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both architectures on native hardware. aarch64 is not decoration here:
    # this library is foreign struct layouts and octet-order handling, and the
    # target it actually runs on is a Raspberry Pi.
    name: linux/${{ matrix.arch }} · sbcl
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sbcl

      # ocicl builds itself with sbcl, which is slow and never changes between
      # runs. The dependency tree is keyed on ocicl.csv because that file pins
      # every system by OCI digest -- if it has not changed, neither have the
      # bytes underneath it.
      - name: Cache ocicl
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/ocicl
          key: ocicl-${{ matrix.arch }}-v1

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ocicl
          key: deps-${{ matrix.arch }}-${{ hashFiles('ocicl.csv') }}

      - name: Test
        run: ci/test.sh

      # tools/live-two-radios/ needs two USB dongles, so CI can never run it --
      # which is exactly how a harness rots into something that no longer
      # compiles by the time you next reach for it. This loads every
      # definition in it, compiles the forms that drive the radios without
      # running them, and asserts on the attribute layout the server builds,
      # all of which is hardware-free.
      # ble/examples is a system so that this can fail loudly. Loading a file
      # by hand can succeed for the wrong reason -- the reader picks up
      # whatever package is current -- while the system fails for a consumer.
      - name: Build the examples
        run: make examples

      - name: Compile-check the live harness
        run: |
          sbcl --non-interactive --no-userinit --no-sysinit \
            --load tools/live-two-radios/compile-check.lisp
